name: ClickFast CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: J2/Aprem/clickfast
      - run: npm test
        working-directory: J2/Aprem/clickfast

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clickfast:${{ github.sha }} J2/Aprem/clickfast
